services:
  postgres:
    image: postgres:16-alpine
    container_name: seguimiento-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seguimiento
      POSTGRES_PASSWORD: seguimiento
      POSTGRES_DB: seguimiento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seguimiento -d seguimiento"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: seguimiento-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://seguimiento:seguimiento@postgres:5432/seguimiento
      TYPEORM_SYNC: "true"
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /uploads
      COOKIE_SECURE: "false"
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: seguimiento-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads_data:
